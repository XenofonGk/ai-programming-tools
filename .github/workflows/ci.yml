name: resume-classifier tests

on:
  push:
    branches: [main]
    paths: ['AI Resume Classifier (NLP + ML)/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['AI Resume Classifier (NLP + ML)/**', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AI Resume Classifier (NLP + ML)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: AI Resume Classifier (NLP + ML)/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python data/generate_dataset.py && python train.py
      - run: python -m pytest -q
